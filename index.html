<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima — mi ubicación</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="icono-sol" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="12" y1="1.6" x2="12" y2="4.4"/>
          <line x1="12" y1="19.6" x2="12" y2="22.4"/>
          <line x1="1.6" y1="12" x2="4.4" y2="12"/>
          <line x1="19.6" y1="12" x2="22.4" y2="12"/>
          <line x1="4.4" y1="4.4" x2="6.3" y2="6.3"/>
          <line x1="17.7" y1="17.7" x2="19.6" y2="19.6"/>
          <line x1="4.4" y1="19.6" x2="6.3" y2="17.7"/>
          <line x1="17.7" y1="6.3" x2="19.6" y2="4.4"/>
        </g>
      </symbol>
      <symbol id="icono-luna" viewBox="0 0 24 24">
        <path d="M15.8 3.3c-4.9.9-8 5.2-7.4 10.1.6 4.9 5 8.4 9.9 7.9-2.4 1.7-5.5 2.5-8.7 1.9C4.3 22.1.6 17 1.5 11.6 2.4 6.2 7.4 2.3 12.8 3.1c1.1.1 2 .4 3 .2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icono-nube" viewBox="0 0 24 24">
        <path d="M6.8 17.2h11a4 4 0 0 0 .4-8 5.4 5.4 0 0 0-10.3 1.6 3.6 3.6 0 0 0-1.1 6.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icono-niebla" viewBox="0 0 24 24">
        <path d="M6.8 12.4h11a4 4 0 0 0 .3-7.9 5.4 5.4 0 0 0-10.2 1.6 3.6 3.6 0 0 0-1.1 6.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="4" y1="17" x2="20" y2="17"/>
          <line x1="6" y1="20.4" x2="18" y2="20.4"/>
        </g>
      </symbol>
      <symbol id="icono-lluvia" viewBox="0 0 24 24">
        <path d="M6.8 11.6h11a4 4 0 0 0 .3-7.9A5.4 5.4 0 0 0 7.9 5.3a3.6 3.6 0 0 0-1.1 6.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="8" y1="16" x2="6.6" y2="20"/>
          <line x1="13" y1="16" x2="11.6" y2="20"/>
          <line x1="18" y1="16" x2="16.6" y2="20"/>
        </g>
      </symbol>
      <symbol id="icono-nieve" viewBox="0 0 24 24">
        <path d="M6.8 11.6h11a4 4 0 0 0 .3-7.9A5.4 5.4 0 0 0 7.9 5.3a3.6 3.6 0 0 0-1.1 6.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="7.6" y1="16.4" x2="7.6" y2="20.4"/>
          <line x1="5.8" y1="18.4" x2="9.4" y2="18.4"/>
          <line x1="16.4" y1="16.4" x2="16.4" y2="20.4"/>
          <line x1="14.6" y1="18.4" x2="18.2" y2="18.4"/>
        </g>
      </symbol>
      <symbol id="icono-tormenta" viewBox="0 0 24 24">
        <path d="M6.8 10.8h11a4 4 0 0 0 .3-7.9A5.4 5.4 0 0 0 7.9 4.5a3.6 3.6 0 0 0-1.1 6.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M13.2 13.4l-3.4 5h3l-1.6 4.4 4.6-6h-2.8l1.7-3.4z" fill="currentColor" stroke="none"/>
      </symbol>
      <symbol id="icono-ubicacion" viewBox="0 0 24 24">
        <path d="M12 21.5s6.5-6.3 6.5-11.3a6.5 6.5 0 0 0-13 0c0 5 6.5 11.3 6.5 11.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </symbol>
      <symbol id="icono-buscar" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <line x1="15.3" y1="15.3" x2="21" y2="21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </symbol>
      <symbol id="icono-gota" viewBox="0 0 24 24">
        <path d="M12 2.8c3 4 6 7.6 6 11.3a6 6 0 1 1-12 0c0-3.7 3-7.3 6-11.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icono-viento" viewBox="0 0 24 24">
        <path d="M2.5 8.5h11.8a2.8 2.8 0 1 0-2.2-4.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M2.5 12.5h15.6a3.1 3.1 0 1 1-2.4 5.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M2.5 16.5h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="icono-presion" viewBox="0 0 24 24">
        <circle cx="12" cy="13" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 13l3.6-4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="12" cy="13" r="1.1" fill="currentColor" stroke="none"/>
      </symbol>
      <symbol id="icono-ojo" viewBox="0 0 24 24">
        <path d="M1.5 12S5.2 5.5 12 5.5 22.5 12 22.5 12 18.8 18.5 12 18.5 1.5 12 1.5 12z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </symbol>
    </defs>
  </svg>

  <div class="contenedor">

    <header class="encabezado">
      <h1 class="titulo-app">Clima</h1>

      <div class="buscador">
        <div class="buscador-fila">
          <input
            id="campo-busqueda"
            type="text"
            placeholder="Buscar una ciudad"
            autocomplete="off"
            aria-label="Buscar una ciudad"
          >
          <button id="boton-ubicarme" class="boton-icono" title="Usar mi ubicación actual" aria-label="Usar mi ubicación actual">
            <svg class="icono" width="18" height="18"><use href="#icono-ubicacion"/></svg>
          </button>
        </div>
        <div id="lista-sugerencias" class="lista-sugerencias"></div>
      </div>
    </header>

    <main>

      <div id="mensaje-de-estado" class="mensaje-de-estado" hidden></div>

      <section id="tarjeta-principal" class="tarjeta-principal">
        <p id="texto-lugar" class="texto-lugar">Ubicando…</p>

        <div class="fila-temperatura">
          <span id="temperatura-actual" class="temperatura-actual">—</span>
        </div>

        <p id="estado-del-cielo" class="estado-del-cielo">&nbsp;</p>
        <p id="linea-secundaria" class="linea-secundaria"></p>

        <button id="boton-unidad" class="boton-unidad">°F</button>
      </section>

      <section id="seccion-horas" class="seccion" hidden>
        <h2 class="titulo-seccion">Próximas horas</h2>
        <div id="lista-horas" class="lista-horas"></div>
      </section>

      <section id="seccion-dias" class="seccion" hidden>
        <h2 class="titulo-seccion">Próximos días</h2>
        <div id="lista-dias" class="lista-dias"></div>
      </section>

      <section id="seccion-detalles" class="seccion" hidden>
        <h2 class="titulo-seccion">Detalles</h2>
        <div id="grilla-detalles" class="grilla-detalles"></div>
      </section>

    </main>

    <footer class="pie">
      Datos meteorológicos de <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>, sin necesidad de clave de API.
    </footer>

  </div>

  <script src="js/utilidades.js"></script>
  <script src="js/ubicacion.js"></script>
  <script src="js/clima.js"></script>

</body>
</html>
